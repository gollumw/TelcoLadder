# 5GSM cause values —— TS 24.501 §9.11.4.2。
# 人工核對的規範資產。AI 不得產出 spec / clause 欄位。

table: nas_5gsm
spec: "3GPP TS 24.501"
clause: "§9.11.4.2"

causes:
  8:
    name: "Operator determined barring"
    plain: 'Operator policy blocks this PDU session outright.'
    plain_zh: '營運商政策直接擋下這個 PDU session。'
    common_causes:
      - 'Service suspended for non-payment'
      - 'The value-added service was switched off'
    common_causes_zh:
      - "欠費停話"
      - "加值服務被關閉"

  26:
    name: "Insufficient resources"
    plain: 'The network does not have the resources to set this session up.'
    plain_zh: '網路資源不足，建不起這個 session。'
    common_causes:
      - 'The UPF has run out of resources'
      - 'The SMF has hit its session limit'
    common_causes_zh:
      - "UPF 資源耗盡"
      - "SMF 達到 session 數上限"

  27:
    name: "Missing or unknown DNN"
    plain: 'No DNN was supplied, or the one supplied is not known to the network.'
    plain_zh: '沒帶 DNN，或帶的 DNN 網路不認得。'
    common_causes:
      - 'The APN/DNN configured on the UE is misspelt'
      - 'The SMF has no configuration for this DNN'
      - 'The subscription does not include this DNN'
    common_causes_zh:
      - "UE 的 APN/DNN 設定拼錯"
      - "SMF 沒設定這個 DNN"
      - "簽約資料裡沒有這個 DNN"

  28:
    name: "Unknown PDU session type"
    plain: 'The requested PDU session type is not one the network recognises.'
    plain_zh: '要求的 PDU session 型別網路不認得。'
    common_causes:
      - 'The UE asked for a type the network does not support'
    common_causes_zh:
      - "UE 要求了網路未支援的型別"

  29:
    name: "User authentication or authorization failed"
    plain: 'Secondary authentication or authorisation failed (the DN-AAA step).'
    plain_zh: '次級鑑權／授權沒過（DN-AAA 那一段）。'
    common_causes:
      - 'The external AAA server refused'
      - 'Wrong credentials or certificate'
    common_causes_zh:
      - "外部 AAA 伺服器拒絕"
      - "憑證或帳密錯誤"

  31:
    name: "Request rejected, unspecified"
    plain: 'The request was rejected with no reason given.'
    plain_zh: '請求被拒，未說明原因。'
    common_causes:
      - 'An internal SMF policy refused it'
    common_causes_zh:
      - "SMF 內部策略拒絕"

  32:
    name: "Service option not supported"
    plain: 'The network does not support this service option.'
    plain_zh: '網路不支援這個服務選項。'
    common_causes:
      - 'The feature is not enabled'
    common_causes_zh:
      - "功能未開通"

  33:
    name: "Requested service option not subscribed"
    plain: 'The subscriber has not subscribed to this service option.'
    plain_zh: '用戶沒有訂閱這個服務選項。'
    common_causes:
      - 'The subscription does not include that service'
    common_causes_zh:
      - "簽約資料未包含該服務"

  36:
    name: "Regular deactivation"
    plain: 'A normal release, not an error. Nothing to chase here.'
    plain_zh: '正常釋放，不是錯誤。看到這個不必追。'
    common_causes:
      - 'The UE closed the session itself'
      - 'An idle timeout'
    common_causes_zh:
      - "UE 主動關閉 session"
      - "閒置逾時"

  38:
    name: "Network failure"
    plain: 'Something went wrong on the network side.'
    plain_zh: '網路端出錯。'
    common_causes:
      - 'A PFCP procedure between the SMF and the UPF failed'
      - 'The UPF is unreachable'
    common_causes_zh:
      - "SMF 與 UPF 之間的 PFCP 程序失敗"
      - "UPF 不可達"

  39:
    name: "Reactivation requested"
    plain: 'The network is asking the UE to re-activate this session.'
    plain_zh: '網路要求 UE 重新啟用這個 session。'
    common_causes:
      - 'The context on the network side needs rebuilding'
    common_causes_zh:
      - "網路端 context 需要重建"

  43:
    name: "Invalid PDU session identity"
    plain: 'The PDU session identity is not valid.'
    plain_zh: 'PDU session 識別碼無效。'
    common_causes:
      - 'The UE and the network disagree about the session numbering'
    common_causes_zh:
      - "UE 與網路對 session 編號的認知不同步"

  46:
    name: "Out of LADN service area"
    plain: 'The UE has moved outside the service area of that LADN.'
    plain_zh: 'UE 離開了該 LADN 的服務範圍。'
    common_causes:
      - 'It moved out of the LADN''s coverage'
    common_causes_zh:
      - "移動到 LADN 涵蓋範圍外"

  50:
    name: "PDU session type IPv4 only allowed"
    plain: 'IPv4 only. The UE asked for IPv6 or IPv4v6.'
    plain_zh: '只准 IPv4。UE 要了 IPv6 或 IPv4v6。'
    common_causes:
      - 'The DNN is configured for IPv4 only'
    common_causes_zh:
      - "DNN 只設定了 IPv4"

  51:
    name: "PDU session type IPv6 only allowed"
    plain: 'IPv6 only.'
    plain_zh: '只准 IPv6。'
    common_causes:
      - 'The DNN is configured for IPv6 only'
    common_causes_zh:
      - "DNN 只設定了 IPv6"

  54:
    name: "PDU session does not exist"
    plain: 'The session being operated on does not exist on the network side.'
    plain_zh: '要操作的 session 在網路端不存在。'
    common_causes:
      - 'The session was already released and the UE is still using the old identity'
    common_causes_zh:
      - "session 已被釋放，UE 還在用舊的識別碼"

  57:
    name: "PDU session type IPv4v6 only allowed"
    plain: 'Dual-stack only.'
    plain_zh: '只准雙堆疊。'
    common_causes:
      - 'A DNN configuration restriction'
    common_causes_zh:
      - "DNN 設定限制"

  67:
    name: "Insufficient resources for specific slice and DNN"
    plain: 'Not enough resources for this slice combined with this DNN.'
    plain_zh: '這個切片加上這個 DNN 的組合資源不足。'
    common_causes:
      - 'The slice quota is used up'
    common_causes_zh:
      - "切片配額用盡"

  68:
    name: "Not supported SSC mode"
    plain: 'The requested SSC mode is not supported.'
    plain_zh: '不支援要求的 SSC 模式。'
    common_causes:
      - 'The SSC mode the UE asked for is not implemented in the network'
    common_causes_zh:
      - "UE 要求的 SSC mode 網路未實作"

  69:
    name: "Insufficient resources for specific slice"
    plain: 'Not enough resources on that slice.'
    plain_zh: '該切片資源不足。'
    common_causes:
      - 'The slice quota is used up'
    common_causes_zh:
      - "切片配額用盡"

  70:
    name: "Missing or unknown DNN in a slice"
    plain: 'That DNN cannot be found within this slice.'
    plain_zh: '在這個切片裡找不到該 DNN。'
    common_causes:
      - 'The S-NSSAI and DNN combination was never configured'
    common_causes_zh:
      - "S-NSSAI 與 DNN 的組合沒設定"

  82:
    name: "Maximum data rate per UE for user-plane integrity protection is too low"
    plain: 'The user-plane integrity protection rate the UE supports is too low for what the network requires.'
    plain_zh: 'UE 支援的使用者面完整性保護速率太低，達不到網路要求。'
    common_causes:
      - 'An older UE that only supports 64 kbps integrity protection while the network asks for full rate'
    common_causes_zh:
      - "較舊的 UE 只支援 64 kbps 完整性保護，而網路要求全速率"

  95:
    name: "Semantically incorrect message"
    plain: 'The message is semantically incorrect.'
    plain_zh: '訊息語意不正確。'
    common_causes:
      - 'Incompatible implementations'
    common_causes_zh:
      - "實作不相容"

  96:
    name: "Invalid mandatory information"
    plain: 'A mandatory information element holds an invalid value.'
    plain_zh: '必要資訊元素內容無效。'
    common_causes:
      - 'An encoding bug'
    common_causes_zh:
      - "編碼錯誤"

  97:
    name: "Message type non-existent or not implemented"
    plain: 'The message type does not exist, or is not implemented.'
    plain_zh: '訊息型別不存在或未實作。'
    common_causes:
      - 'A release gap'
    common_causes_zh:
      - "版本落差"

  111:
    name: "Protocol error, unspecified"
    plain: 'Protocol error; the spec does not say more than that.'
    plain_zh: '協定錯誤，規範未指明細節。'
    common_causes:
      - 'Encode/decode incompatibility, common when two vendors interconnect'
      - 'A mandatory IE is missing'
    common_causes_zh:
      - "編碼／解碼不相容，常見於跨廠商互連"
      - "必要 IE 缺漏"

  # ── 2026-08-29 補齊：oracle 46 條中先前未收的 20 條（多數與 ESM 是孿生條目，措辭一致） ──
  34:
    name: "Service option temporarily out of order"
    plain: 'The service exists and is subscribed, but is temporarily unavailable. Retrying later is the right response.'
    plain_zh: '服務存在也有訂閱，只是暫時不可用。稍後重試才是正確的反應。'

  35:
    name: "PTI already in use"
    plain: 'The procedure transaction identifier this request used is already taken by another procedure in flight.'
    plain_zh: '這個請求用的程序交易識別碼（PTI）已經被另一個進行中的程序佔用。'

  37:
    name: "5GS QoS not accepted"
    plain: 'The UE would not accept the QoS the network offered.'
    plain_zh: 'UE 不接受網路提供的 QoS。'

  41:
    name: "Semantic error in the TFT operation"
    plain: 'The traffic flow template operation does not make sense - for example deleting a filter that is not there.'
    plain_zh: 'TFT（流量範本）操作講不通 —— 例如刪除一個根本不存在的過濾器。'

  42:
    name: "Syntactical error in the TFT operation"
    plain: 'The traffic flow template is malformed.'
    plain_zh: 'TFT（流量範本）格式錯誤。'

  44:
    name: "Semantic errors in packet filter(s)"
    plain: 'A packet filter is internally contradictory - it parses, but it cannot mean anything.'
    plain_zh: '封包過濾器自相矛盾 —— 解得開，但沒有任何意義。'

  45:
    name: "Syntactical error in packet filter(s)"
    plain: 'A packet filter is malformed.'
    plain_zh: '封包過濾器格式錯誤。'

  47:
    name: "PTI mismatch"
    plain: 'The procedure transaction identifier does not match the procedure it claims to belong to.'
    plain_zh: '程序交易識別碼與它宣稱所屬的程序對不上。'

  58:
    name: "PDU session type Unstructured only allowed"
    plain: 'Only the Unstructured PDU session type is permitted here - typically a cellular IoT deployment.'
    plain_zh: '這裡只允許 Unstructured 型別的 PDU session —— 通常是蜂巢式 IoT 的部署。'

  59:
    name: "Unsupported 5QI value"
    plain: 'The QoS identifier asked for is not supported here.'
    plain_zh: '要求的 5QI（QoS 識別碼）在這裡不支援。'
    common_causes:
      - 'The 5QI is configured in one part of the network but not another'
    common_causes_zh:
      - '這個 5QI 只在網路的一部分有設定，另一部分沒有'

  61:
    name: "PDU session type Ethernet only allowed"
    plain: 'Only Ethernet PDU session type is permitted here.'
    plain_zh: '這裡只允許 Ethernet 型別的 PDU session。'

  81:
    name: "Invalid PTI value"
    plain: 'The procedure transaction identifier is outside the valid range.'
    plain_zh: '程序交易識別碼超出合法範圍。'

  83:
    name: "Semantic error in the QoS operation"
    plain: 'The QoS operation does not make sense - for example modifying a QoS rule that is not there.'
    plain_zh: 'QoS 操作講不通 —— 例如修改一條根本不存在的 QoS 規則。'

  84:
    name: "Syntactical error in the QoS operation"
    plain: 'The QoS operation is malformed.'
    plain_zh: 'QoS 操作格式錯誤。'

  85:
    name: "Invalid mapped EPS bearer identity"
    plain: 'The EPS bearer this 5G session maps to does not exist - the 4G/5G interworking mapping is broken.'
    plain_zh: '這個 5G session 映射到的 EPS 承載不存在 —— 4G/5G 互通的映射斷了。'
    common_causes:
      - 'An interworking handover left the mapping half-updated'
    common_causes_zh:
      - '互通換手把映射弄到半更新狀態'

  86:
    name: "UAS services not allowed"
    plain: 'Uncrewed-aircraft services are not allowed for this session.'
    plain_zh: '無人機（UAS）服務對這個 session 不被允許。'

  98:
    name: "Message type not compatible with the protocol state"
    plain: 'The message type is understood, but arriving now makes no sense given where the two sides are in the procedure.'
    plain_zh: '訊息型別看得懂，但以雙方目前在程序中的位置來說，這時候收到它講不通。'
    common_causes:
      - 'A retransmission that arrived after the procedure had already moved on'
      - 'The two sides disagree about the current state, often after a lost message'
    common_causes_zh:
      - '重送的訊息在程序已經往前走之後才到'
      - '雙方對目前狀態的認知不一致，常見於前面掉了一則訊息'

  99:
    name: "Information element non-existent or not implemented"
    plain: 'The message carried an information element the receiver does not recognise.'
    plain_zh: '訊息裡帶了接收端不認得的資訊元素。'
    common_causes:
      - 'One side supports a newer release than the other'
    common_causes_zh:
      - '一側支援的版本比另一側新'

  100:
    name: "Conditional IE error"
    plain: 'An information element that is required under these particular conditions is missing or malformed.'
    plain_zh: '在這個特定條件下該出現的資訊元素缺席或格式錯誤。'

  101:
    name: "Message not compatible with the protocol state"
    plain: 'The message itself is valid but does not belong in the state the protocol is currently in.'
    plain_zh: '訊息本身合法，但不屬於協定目前所在的狀態。'

