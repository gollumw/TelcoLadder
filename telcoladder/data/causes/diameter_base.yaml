# Diameter 基礎 Result-Code —— RFC 6733 的 `Result-Code` AVP（code 268）。
#
# ## 這張表與 `diameter_3gpp.yaml` 是兩個不同的號碼空間，不能混用
#
# 同一個號碼在兩張表裡意思完全不同：
#
#     Result-Code 5001              = DIAMETER_AVP_UNSUPPORTED（訊息裡有對方不認得的 AVP）
#     Experimental-Result-Code 5001 = DIAMETER_ERROR_USER_UNKNOWN（HSS 裡沒這個用戶）
#     Result-Code 5003              = DIAMETER_AUTHORIZATION_REJECTED
#     Experimental-Result-Code 5003 = DIAMETER_ERROR_IDENTITY_NOT_REGISTERED
#     Result-Code 5004              = DIAMETER_INVALID_AVP_VALUE
#     Experimental-Result-Code 5004 = DIAMETER_ERROR_ROAMING_NOT_ALLOWED
#
# 查錯表會得到一個看起來完全合理的錯誤解釋 —— 與專案 CLAUDE.md §3.2（NGAP 的
# Cause 是 CHOICE，五個群組各自從 0 編號）同一類的陷阱。**選表的依據是這個號碼
# 從哪個 AVP 讀出來的**，不是 Application-Id、不是介面名（`adapters/diameter.py`）。
#
# ## 名稱的出處
#
# `name` 逐字取自 tshark 自己的 `diameter.Result-Code` 值表
# （`tshark -G values`）—— 那是 Wireshark 內建、與本專案獨立的實作。
# `tests/test_adapter_diameter.py::test_cause_names_match_tsharks_own_table`
# 逐條比對，抄錯會紅。
#
# ## 為什麼沒有 clause
#
# 上面那個 oracle 給得出**名稱**，給不出**節號**。RFC 6733 §7.1 建立的是一個
# IANA 登錄表，號碼陸續由不同 RFC 補進去（4006 的信用控制、4740 的 SIP…），
# 所以「這個號碼在第幾節」沒有單一答案，而人工核對還沒做。
#
# 專案 CLAUDE.md §2.3：AI 不得生成 3GPP／RFC 條號。**少一個節號只是不方便，
# 多一個錯的節號會被當真** —— 比照 `pfcp.py` 的同一個裁定。要補請人工核對後
# 逐條加 `clause:`（`causes.py` 已支援選用）。
#
# 欄位與 `nas_5gmm.yaml` 相同：
#   name                        規範裡的正式名稱，逐字照抄，不翻
#   plain / common_causes       給人看的白話與現場根因，**英文是原文**
#   plain_zh / common_causes_zh 中文（理由見 `causes.py` 的 `CauseInfo.plain_zh`）
#
# plain 與 common_causes 一律寫**純文字** —— 會被原樣畫進 Mermaid 標籤與網頁，
# 兩邊都不解析 markdown。

table: diameter_base
spec: "RFC 6733"

causes:
  2001:
    name: "DIAMETER_SUCCESS"
    plain: 'The request succeeded. This is the only base result code that means outright success.'
    plain_zh: '請求成功。這是唯一代表「完全成功」的基礎結果碼。'

  3001:
    name: "DIAMETER_COMMAND_UNSUPPORTED"
    plain: 'The peer does not implement this command code at all - the request reached a node that does not speak this application.'
    plain_zh: '對端根本沒有實作這個命令碼 —— 請求送到了一台不講這個應用的節點。'
    common_causes:
      - 'Wrong Application-Id advertised at CER/CEA, so the request was routed to a peer that cannot serve it'
      - 'A vendor-specific command sent to a node without that vendor extension'
    common_causes_zh:
      - "CER/CEA 交換時宣告錯 Application-Id，請求被路由到一台服務不了它的節點"
      - "廠商私有的命令送到了沒有該廠商擴充的節點"

  3002:
    name: "DIAMETER_UNABLE_TO_DELIVER"
    plain: 'The node that received the request could not deliver it onward - usually a relay (DRA) with no next hop for it.'
    plain_zh: '收到請求的節點沒辦法把它送到目的地 —— 通常是中繼（DRA）找不到下一跳。'
    common_causes:
      - 'Destination-Host points at a node that does not exist or is down'
      - 'The DRA''s routing table has no next hop for that realm'
      - 'The Diameter connection to the destination dropped and the DRA has not converged yet'
    common_causes_zh:
      - "Destination-Host 指向一台不存在或已下線的節點"
      - "DRA 的路由表沒有這個 realm 的下一跳"
      - "目的節點的 Diameter 連線斷了，DRA 還沒收斂"

  3003:
    name: "DIAMETER_REALM_NOT_SERVED"
    plain: 'The node that received the request does not serve the realm named in Destination-Realm.'
    plain_zh: '收到請求的節點不服務 Destination-Realm 指的那個 realm。'
    common_causes:
      - 'A roaming partner''s realm was never configured in the DRA or HSS'
      - 'Destination-Realm is misspelt, or carries the wrong MCC/MNC'
    common_causes_zh:
      - "漫遊夥伴的 realm 沒設進 DRA 或 HSS"
      - "Destination-Realm 拼錯，或帶了錯的 MCC/MNC"

  3004:
    name: "DIAMETER_TOO_BUSY"
    plain: 'The peer is temporarily overloaded - retry, or send it elsewhere. This is transient, not a configuration problem.'
    plain_zh: '對端暫時過載，請重試或改送別台。這是暫時性錯誤，不是設定問題。'
    common_causes:
      - 'The HSS or PCRF is being hammered at a traffic peak'
      - 'Many UEs re-attaching at once (an attach storm after an outage)'
    common_causes_zh:
      - "HSS/PCRF 在流量尖峰被打爆"
      - "大量 UE 同時重新附著（網路故障後的 attach storm）"

  3005:
    name: "DIAMETER_LOOP_DETECTED"
    plain: 'The message came back round to this node through the relays - its own identity appeared in a Route-Record.'
    plain_zh: '訊息在中繼之間繞回自己 —— Route-Record 裡出現了本節點。'
    common_causes:
      - 'Two DRAs each pointing at the other as the next hop'
      - 'Realm routing configured into a loop'
    common_causes_zh:
      - "兩台 DRA 互指對方當下一跳"
      - "realm 路由設定成環"

  3006:
    name: "DIAMETER_REDIRECT_INDICATION"
    plain: 'A redirect agent is telling the sender to send this request somewhere else (Redirect-Host) - it is a routing instruction, not a rejection of the subscriber.'
    plain_zh: 'redirect agent 告訴發送端「這個請求改送別處」（Redirect-Host）—— 這是路由指示，不是拒絕訂戶。'
    common_causes:
      - 'The DRA is configured as a redirect agent for this realm or application, so the client is expected to re-send to the Redirect-Host itself'
      - 'The request carried no Destination-Host, so realm routing landed on the redirect agent instead of the serving node'
      - 'If the client never re-sends to the Redirect-Host, the transaction silently dies here - check the client for redirect support'
    common_causes_zh:
      - "DRA 對這個 realm 或應用設成 redirect agent，client 要自己改送給 Redirect-Host"
      - "請求沒帶 Destination-Host，realm 路由落到 redirect agent 而不是真正服務的節點"
      - "client 若從不改送給 Redirect-Host，這筆交易就在這裡靜靜死掉 —— 查 client 有沒有支援 redirect"

  3007:
    name: "DIAMETER_APPLICATION_UNSUPPORTED"
    plain: 'The peer does not support the Application-Id this message declares. The connection is up, but this interface cannot be spoken.'
    plain_zh: '對端不支援這則訊息宣告的 Application-Id。連線建得起來，但這個介面談不成。'
    common_causes:
      - 'CER/CEA never negotiated this application (one side has it, the other does not)'
      - 'Wrong interface: an S6a request sent to a node that only serves Cx'
      - 'A release gap - the new interface does not exist on the older node yet'
    common_causes_zh:
      - "CER/CEA 沒有協商到這個 application（一邊有、一邊沒有）"
      - "打錯介面：把 S6a 的請求送到只開 Cx 的節點"
      - "版本落差，新介面對舊節點還不存在"

  3008:
    name: "DIAMETER_INVALID_HDR_BITS"
    plain: 'The request header had a flag combination the receiver rejects (for example the R bit set on an answer, or an unknown flag set).'
    plain_zh: '請求標頭的旗標組合不被接受（例如 answer 帶著 R 位元、或設了未定義的旗標）。'
    common_causes: []
    common_causes_zh: []

  3009:
    name: "DIAMETER_INVALID_AVP_BITS"
    plain: 'An AVP in the request had flag bits set that are not allowed for it (the offending AVP is in Failed-AVP).'
    plain_zh: '請求裡某個 AVP 的旗標位元不合法（出錯的 AVP 在 Failed-AVP 裡）。'
    common_causes: []
    common_causes_zh: []

  3010:
    name: "DIAMETER_UNKNOWN_PEER"
    plain: 'The peer does not recognise the sender - its Origin-Host is not in the peer table on the other side.'
    plain_zh: '對端不認得這個發起者 —— 它的 Origin-Host 不在對方的 peer 表裡。'
    common_causes:
      - 'A new node was configured on one side only'
      - 'Origin-Host does not match the configured string (case, or the FQDN suffix)'
    common_causes_zh:
      - "新增節點時只在一邊設了 peer"
      - "Origin-Host 與對方設定的字串不一致（大小寫、FQDN 尾綴）"

  3011:
    name: "DIAMETER_REALM_REDIRECT_INDICATION"
    plain: 'A redirect agent is telling the sender that the whole realm is served elsewhere (Redirect-Realm) - a routing instruction, not a subscriber failure.'
    plain_zh: 'redirect agent 告訴發送端整個 realm 由別處服務（Redirect-Realm）—— 路由指示，不是訂戶失敗。'
    common_causes: []
    common_causes_zh: []

  4001:
    name: "DIAMETER_AUTHENTICATION_REJECTED"
    plain: 'Authentication was rejected. Note this is the base result code - 3GPP authentication failures normally arrive as an Experimental-Result-Code instead.'
    plain_zh: '鑑權被拒。**注意這是基礎結果碼**，3GPP 的鑑權失敗多半走 Experimental-Result-Code。'

  4002:
    name: "DIAMETER_OUT_OF_SPACE"
    plain: 'The peer has no room to store this record (usually charging). Transient.'
    plain_zh: '對端沒有空間存這筆資料（多見於計費）。暫時性。'

  5001:
    name: "DIAMETER_AVP_UNSUPPORTED"
    plain: 'The message carries an AVP the peer does not recognise but which is flagged mandatory (the M bit), so the whole message was rejected.'
    plain_zh: '訊息裡有一個對方不認得、但被標成必要（M 旗標）的 AVP，所以整則被拒。'
    common_causes:
      - 'The two ends run different 3GPP releases and the new AVP does not exist on the older one'
      - 'A vendor-specific AVP sent to another vendor''s equipment with the M bit set'
      - 'The wrong Vendor-Id, so the peer cannot find the AVP''s definition'
    common_causes_zh:
      - "兩端的 3GPP release 版本不同，新 AVP 對舊節點不存在"
      - "廠商自訂 AVP 標了 M 旗標送給別家設備"
      - "Vendor-Id 帶錯，對方查不到那個 AVP 的定義"

  5002:
    name: "DIAMETER_UNKNOWN_SESSION_ID"
    plain: 'The peer does not recognise this Session-Id - that session no longer exists on its side.'
    plain_zh: '對方不認得這個 Session-Id —— 那個工作階段在它那邊已經不存在了。'
    common_causes:
      - 'The PCRF or HSS restarted and lost its session state while the peer still uses the old Session-Id'
      - 'A termination message (STR / CCR-T) already closed it and something was sent afterwards'
      - 'The two ends disagree about the session''s lifetime'
    common_causes_zh:
      - "PCRF/HSS 重啟後 session 狀態沒了，而對端還在用舊的 Session-Id"
      - "先前的終止訊息（STR/CCR-T）已經把它關掉了，之後又送了一則"
      - "兩端對 session 生命週期的認知不同步"

  5003:
    name: "DIAMETER_AUTHORIZATION_REJECTED"
    plain: 'The user''s identity is fine, but this service is not allowed for them. This is authorisation refused, not authentication failure.'
    plain_zh: '使用者身分沒問題，但這個服務不允許他用。**這是授權被拒，不是鑑權失敗。**'
    common_causes:
      - 'The subscription does not include this service'
      - 'Policy (the PCRF) explicitly refused this IP-CAN session'
    common_causes_zh:
      - "簽約資料裡沒開這個服務"
      - "策略（PCRF）明確拒絕了這條 IP-CAN session"

  5004:
    name: "DIAMETER_INVALID_AVP_VALUE"
    plain: 'One AVP holds an illegal value - right type, wrong content. The answer usually names it in Failed-AVP.'
    plain_zh: '某個 AVP 的值不合法 —— 型別對、內容不對。回覆通常會用 Failed-AVP 指出是哪一個。'
    common_causes:
      - 'An encoding bug (a length field disagreeing with the content, a string not padded)'
      - 'An enumerated value outside the range the spec defines'
      - 'An IMSI or MSISDN with non-digits, or the wrong length'
    common_causes_zh:
      - "編碼錯誤（長度欄與內容不符、字串沒補齊）"
      - "列舉值超出規範定義的範圍"
      - "IMSI/MSISDN 帶了非數字或長度不對"

  5005:
    name: "DIAMETER_MISSING_AVP"
    plain: 'An AVP the spec requires is missing. The Failed-AVP in the answer names which one.'
    plain_zh: '少了一個規範要求必須有的 AVP。回覆的 Failed-AVP 會指出缺哪一個。'
    common_causes:
      - 'An implementation omits a conditional AVP (some fields are only mandatory in certain situations)'
      - 'A release gap: a newer version made that AVP mandatory'
    common_causes_zh:
      - "實作漏帶條件性 AVP（某些欄位只在特定情境必要）"
      - "release 落差：新版把某個 AVP 改成必要"

  5009:
    name: "DIAMETER_AVP_OCCURS_TOO_MANY_TIMES"
    plain: 'An AVP appears more times than the spec allows.'
    plain_zh: '某個 AVP 出現次數超過規範允許的上限。'

  5012:
    name: "DIAMETER_UNABLE_TO_COMPLY"
    plain: 'The peer understood the request and simply could not carry it out - and had no more precise code to send. This is the least informative permanent failure there is, close to an internal error.'
    plain_zh: '對方看得懂這則請求，但就是做不到 —— 而且沒有更精確的碼可用。這是資訊量最低的一個永久失敗，接近「內部錯誤」。'
    common_causes:
      - 'An internal exception on the peer (a database it cannot reach, a back-end service that is down)'
      - 'A legal request that lands in a situation the peer never implemented'
      - 'Incomplete configuration - the peer would rather refuse the whole thing than do half of it'
      - 'When you see 5012 the answer is almost certainly in the peer''s logs, not in the packet'
    common_causes_zh:
      - "對端內部例外（資料庫連不上、後端服務掛了）"
      - "請求本身合法但落在對端沒實作的情境"
      - "設定不完整，對端寧可整則拒絕也不部分執行"
      - "看到 5012 時，答案幾乎一定在對端的日誌裡，不在封包裡"

  5017:
    name: "DIAMETER_NO_COMMON_SECURITY"
    plain: 'CER/CEA could not agree on a security mechanism both sides support, so the connection cannot be established.'
    plain_zh: 'CER/CEA 協商不出雙方都支援的安全機制，連線建不起來。'
