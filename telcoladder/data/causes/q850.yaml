# ITU-T Q.850 cause values, as carried in the SIP Reason header
# (`Reason: Q.850;cause=16;text="Normal call clearing"`, RFC 3326) on BYE,
# CANCEL and final responses - and as the MGCF maps ISUP releases into SIP.
#
# ## Names are the oracle's, prose is ours
#
# Every `name` is verbatim from `tshark -G values` for `sip.reason_cause_q850`,
# and a test re-runs that oracle. The `Unassigned` values are kept (the table
# must be complete against the oracle) with a single explanation: the value
# means nothing in Q.850.
#
# ## `outcome: user` - a call outcome, not a network failure
#
# 16 (normal clearing), 17 (busy), 18 (no response), 19 (no answer) and
# 21 (call rejected) describe what the parties did, not what the network
# failed to do. `causes.is_user_outcome()` reads it.
#
# ## No clause numbers
#
# Q.850 is one ITU-T recommendation with one table; a clause would add
# nothing, and none was human-verified (CLAUDE.md red line 3).

table: q850
spec: "ITU-T Q.850"

causes:
  0:
    name: 'Valid cause code not yet received'
    plain: 'No valid cause has been received yet (a placeholder, not a release reason).'
