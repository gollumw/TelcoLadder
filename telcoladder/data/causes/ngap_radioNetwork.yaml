# NGAP CauseRadioNetwork —— TS 38.413 §9.3.1.2。
#
# NGAP 的 Cause 是 CHOICE，五個群組各自從 0 開始編號。這份只涵蓋
# radioNetwork 群組 —— 它是現場最常遇到的一組。
# 未收錄的號碼一律輸出「未收錄」，不猜。
#
# `plain` / `common_causes` 是**英文原文**，`plain_zh` / `common_causes_zh` 是中文
# （理由見 `causes.py` 的 `CauseInfo.plain_zh`）。`name` 是規範原文，不翻。

table: ngap_radioNetwork
spec: "3GPP TS 38.413"
clause: "§9.3.1.2"

causes:
  0:
    name: "unspecified"
    plain: "No reason given. Carries as much information as saying nothing."
    plain_zh: "未指明原因。資訊量等同於沒說。"
    common_causes:
      - "A lazy peer implementation that sends this for every situation"
    common_causes_zh:
      - "對端實作偷懶，什麼情況都送這個"

  2:
    name: "successful-handover"
    plain: "Released because the handover succeeded. Not an error."
    plain_zh: "換手成功而釋放，不是錯誤。"
    common_causes: []
    common_causes_zh: []

  3:
    name: "release-due-to-ngran-generated-reason"
    plain: "A release started by the NG-RAN (the base station side)."
    plain_zh: "由 NG-RAN（基地台側）發起的釋放。"
    common_causes: []
    common_causes_zh: []

  4:
    name: "release-due-to-5gc-generated-reason"
    plain: "A release started by the 5GC (the core network side)."
    plain_zh: "由 5GC（核網側）發起的釋放。"
    common_causes: []
    common_causes_zh: []

  5:
    name: "handover-cancelled"
    plain: "The handover was cancelled."
    plain_zh: "換手被取消。"
    common_causes: []
    common_causes_zh: []

  8:
    name: "ho-target-not-allowed"
    plain: "Handover to this target is not permitted."
    plain_zh: "不允許換手到這個目標。"
    common_causes:
      - "The neighbour relation or policy for the target cell is not open"
    common_causes_zh:
      - "目標細胞的鄰區關係或政策未開放"

  11:
    name: "cell-not-available"
    plain: "The cell is not available."
    plain_zh: "細胞不可用。"
    common_causes:
      - "The cell is locked or restarting"
    common_causes_zh:
      - "細胞被鎖定或正在重啟"

  12:
    name: "unknown-targetID"
    plain: "The handover target identifier is not recognised."
    plain_zh: "不認得換手的目標識別碼。"
    common_causes:
      - "Neighbour configuration disagrees - source and target hold different IDs"
    common_causes_zh:
      - "鄰區設定不一致，來源與目標對 ID 的認知不同"

  13:
    name: "no-radio-resources-available-in-target-cell"
    plain: "The target cell has no radio resources free."
    plain_zh: "目標細胞沒有可用的無線資源。"
    common_causes:
      - "The target cell is at capacity"
    common_causes_zh:
      - "目標細胞滿載"

  14:
    name: "unknown-local-UE-NGAP-ID"
    plain: "The local UE NGAP ID in the message is not recognised."
    plain_zh: "收到的本地 UE NGAP ID 不認得。"
    common_causes:
      - "The UE context was already released and the peer is still using the old ID"
      - "State is out of sync after an AMF or gNB restart"
    common_causes_zh:
      - "UE context 已被釋放，對端還在用舊 ID"
      - "AMF 或 gNB 重啟後狀態不同步"

  15:
    name: "inconsistent-remote-UE-NGAP-ID"
    plain: "The remote UE NGAP ID does not match."
    plain_zh: "遠端 UE NGAP ID 對不上。"
    common_causes:
      - "The two ends hold different UE contexts"
    common_causes_zh:
      - "兩端的 UE context 不同步"

  20:
    name: "user-inactivity"
    plain: "Released after the user was idle too long. Normal behaviour, not a fault."
    plain_zh: "使用者閒置太久而釋放。正常行為，不是故障。"
    common_causes: []
    common_causes_zh: []

  21:
    name: "radio-connection-with-ue-lost"
    plain: "The radio connection to the UE was lost. One of the most common release reasons in the field."
    plain_zh: "與 UE 的無線連線中斷。這是現場最常見的釋放原因之一。"
    common_causes:
      - "Poor coverage - the UE walked out of range"
      - "The UE lost power, or went into a lift or basement"
      - "Severe radio interference"
    common_causes_zh:
      - "涵蓋不足，UE 走出訊號範圍"
      - "UE 突然斷電或進電梯／地下室"
      - "無線環境劇烈干擾"

  22:
    name: "radio-resources-not-available"
    plain: "Not enough radio resources."
    plain_zh: "無線資源不足。"
    common_causes:
      - "The cell is heavily loaded"
    common_causes_zh:
      - "細胞負載過高"

  23:
    name: "invalid-qos-combination"
    plain: "The requested QoS combination is not valid."
    plain_zh: "要求的 QoS 組合無效。"
    common_causes:
      - "The 5QI combined with the other parameters is not supported"
    common_causes_zh:
      - "5QI 與其他參數的組合不被支援"

  24:
    name: "failure-in-radio-interface-procedure"
    plain: "A radio interface procedure failed."
    plain_zh: "無線介面程序失敗。"
    common_causes:
      - "An RRC procedure timed out or failed"
    common_causes_zh:
      - "RRC 程序逾時或失敗"

  25:
    name: "interaction-with-other-procedure"
    plain: "It clashed with another procedure running at the same time."
    plain_zh: "與另一個同時進行的程序衝突。"
    common_causes:
      - "Two procedures competing on the same UE"
    common_causes_zh:
      - "同一個 UE 上有兩個程序競爭"

  26:
    name: "unknown-PDU-session-ID"
    plain: "This PDU session ID is not recognised."
    plain_zh: "不認得這個 PDU session ID。"
    common_causes:
      - "The session was already released and the peer still refers to it"
    common_causes_zh:
      - "session 已釋放而對端仍在引用"

  30:
    name: "encryption-and-or-integrity-protection-algorithms-not-supported"
    plain: "The ciphering or integrity protection algorithms are not supported."
    plain_zh: "加密或完整性保護演算法不被支援。"
    common_causes:
      - "The UE and the network have no security algorithm in common"
    common_causes_zh:
      - "UE 與網路的安全演算法沒有交集"

  34:
    name: "not-supported-5QI-value"
    plain: "This 5QI value is not supported."
    plain_zh: "不支援這個 5QI 值。"
    common_causes:
      - "The base station has no configuration for that 5QI"
    common_causes_zh:
      - "基地台未設定該 5QI"

  36:
    name: "ims-voice-eps-fallback-or-rat-fallback-triggered"
    plain: >-
      EPS fallback or RAT fallback for IMS voice was triggered - the UE wants to
      make a call, but this 5G cell has no VoNR, so it is pushed back to 4G for VoLTE.
    plain_zh: >-
      觸發了 IMS 語音的 EPS fallback 或 RAT fallback —— UE 要打電話，
      但這個 5G 細胞沒有 VoNR，所以把它推回 4G 用 VoLTE。
    common_causes:
      - "VoNR is not enabled in this area, so voice always goes via EPS fallback (by design, not a fault)"
      - "The UE does not support VoNR"
    common_causes_zh:
      - "該區域未開通 VoNR，語音一律走 EPS fallback（設計如此，不是故障）"
      - "UE 不支援 VoNR"

  37:
    name: "up-integrity-protection-not-possible"
    plain: "User-plane integrity protection cannot be provided."
    plain_zh: "無法提供使用者面完整性保護。"
    common_causes:
      - "The rate the UE can integrity-protect is too low"
    common_causes_zh:
      - "UE 支援的完整性保護速率太低"

  38:
    name: "up-confidentiality-protection-not-possible"
    plain: "User-plane ciphering cannot be provided."
    plain_zh: "無法提供使用者面加密保護。"
    common_causes:
      - "Incompatible algorithms"
    common_causes_zh:
      - "演算法不相容"

  39:
    name: "slice-not-supported"
    plain: "This network slice is not supported."
    plain_zh: "不支援這個網路切片。"
    common_causes:
      - "The base station has no configuration for that S-NSSAI"
      - "The slice the UE asked for is not offered in this tracking area"
    common_causes_zh:
      - "基地台未設定該 S-NSSAI"
      - "UE 要求的切片在此追蹤區不提供"

  40:
    name: "ue-in-rrc-inactive-state-not-reachable"
    plain: "The UE is in RRC inactive and cannot be reached."
    plain_zh: "UE 處於 RRC inactive 且叫不到。"
    common_causes:
      - "RAN paging failed"
    common_causes_zh:
      - "RAN 尋呼失敗"

  41:
    name: "redirection"
    plain: "Released because of a redirection."
    plain_zh: "因重導向而釋放。"
    common_causes: []
    common_causes_zh: []

  42:
    name: "resources-not-available-for-the-slice"
    plain: "No resources are available for that slice."
    plain_zh: "該切片沒有可用資源。"
    common_causes:
      - "The slice quota is used up"
    common_causes_zh:
      - "切片配額用盡"

  45:
    name: "n26-interface-not-available"
    plain: "The N26 interface is not available, so there is no interworking handover to the EPC."
    plain_zh: "N26 介面不可用，無法與 EPC 做互通換手。"
    common_causes:
      - "N26 was never deployed, so 5G-to-4G interworking falls back to a non-seamless re-attach"
    common_causes_zh:
      - "未部署 N26，5G↔4G 互通只能走非無縫的重新附著"

  46:
    name: "release-due-to-pre-emption"
    plain: "Pre-empted by a higher-priority bearer and released."
    plain_zh: "被較高優先權的承載搶佔而釋放。"
    common_causes:
      - "The ARP priority makes this bearer pre-emptable"
    common_causes_zh:
      - "ARP 優先權設定使此承載可被搶佔"

  # ── 2026-08-29 補齊：oracle 59 條中先前未收的 30 條 ──
  1:
    name: "txnrelocoverall-expiry"
    plain: 'An Xn handover ran out of time overall. The handover was attempted and did not finish.'
    plain_zh: 'Xn 換手的整體計時器到期。換手嘗試過，但沒有完成。'
    common_causes:
      - 'The target gNB did not respond in time'
      - 'The UE lost the radio link mid-handover'
    common_causes_zh:
      - '目標 gNB 沒有及時回應'
      - 'UE 在換手途中失去無線連線'

  6:
    name: "partial-handover"
    plain: 'Only some of the QoS flows moved across; the rest did not.'
    plain_zh: '只有部分 QoS flow 搬過去了，其餘沒有。'

  7:
    name: "ho-failure-in-target-5GC-ngran-node-or-target-system"
    plain: 'The handover failed on the target side. The reason lives in the target node, not in this message.'
    plain_zh: '換手在目標側失敗。原因在目標節點那邊，不在這則訊息裡。'
    common_causes:
      - 'The target cell had no radio resources at that moment'
      - 'The target node rejected the incoming context'
    common_causes_zh:
      - '目標 cell 當下沒有無線資源'
      - '目標節點拒絕了移入的上下文'

  9:
    name: "tngrelocoverall-expiry"
    plain: 'An NG handover ran out of time overall.'
    plain_zh: 'NG 換手的整體計時器到期。'

  10:
    name: "tngrelocprep-expiry"
    plain: 'The preparation phase of an NG handover timed out - the handover never got as far as being executed.'
    plain_zh: 'NG 換手的準備階段逾時 —— 換手根本還沒走到執行那一步。'
    common_causes:
      - 'The target AMF or gNB did not answer the preparation request'
    common_causes_zh:
      - '目標 AMF 或 gNB 沒有回應準備請求'

  16:
    name: "handover-desirable-for-radio-reason"
    plain: 'The radio side wants to move this UE because another cell would serve it better. Routine mobility, not a fault.'
    plain_zh: '無線側想把這個 UE 搬走，因為別的 cell 服務它會更好。例行的移動性管理，不是故障。'

  17:
    name: "time-critical-handover"
    plain: 'A handover that had to happen urgently, typically because the radio link was about to fail.'
    plain_zh: '必須緊急執行的換手，通常是因為無線連線快要斷了。'

  18:
    name: "resource-optimisation-handover"
    plain: 'The network moved the UE to make better use of its resources. A deliberate optimisation, not a fault.'
    plain_zh: '網路為了更有效運用資源而把 UE 搬走。這是刻意的最佳化，不是故障。'

  19:
    name: "reduce-load-in-serving-cell"
    plain: 'The UE was moved off to relieve load on the cell it was in. Load management, not a fault.'
    plain_zh: '把 UE 搬走以減輕原本 cell 的負載。這是負載管理，不是故障。'

  27:
    name: "unkown-qos-flow-ID"
    plain: 'The QoS flow identifier in this message does not exist on the receiving side. (The misspelling of unknown is the specification''s own.)'
    plain_zh: '訊息裡的 QoS flow 識別碼在接收端不存在。（unkown 這個拼字錯誤是規範自己的。）'
    common_causes:
      - 'The flow was already released and a late message still refers to it'
    common_causes_zh:
      - 'QoS flow 已經釋放，但有一則遲到的訊息還在指涉它'

  28:
    name: "multiple-PDU-session-ID-instances"
    plain: 'The same PDU session identifier appeared more than once where only one was allowed.'
    plain_zh: '同一個 PDU session 識別碼在只該出現一次的地方出現了多次。'

  29:
    name: "multiple-qos-flow-ID-instances"
    plain: 'The same QoS flow identifier appeared more than once where only one was allowed.'
    plain_zh: '同一個 QoS flow 識別碼在只該出現一次的地方出現了多次。'

  31:
    name: "ng-intra-system-handover-triggered"
    plain: 'Released because an NG handover within the same system is taking over. Part of a mobility procedure, not a fault.'
    plain_zh: '因為同系統內的 NG 換手接手而釋放。這是移動性程序的一部分，不是故障。'

  32:
    name: "ng-inter-system-handover-triggered"
    plain: 'Released because a handover to a different system is taking over. Part of a mobility procedure, not a fault.'
    plain_zh: '因為往另一個系統的換手接手而釋放。這是移動性程序的一部分，不是故障。'

  33:
    name: "xn-handover-triggered"
    plain: 'Released because an Xn handover between gNBs is taking over. Part of a mobility procedure, not a fault.'
    plain_zh: '因為 gNB 之間的 Xn 換手接手而釋放。這是移動性程序的一部分，不是故障。'

  35:
    name: "ue-context-transfer"
    plain: 'The UE context is being transferred to another node; this side releases its copy. Part of a mobility procedure, not a fault.'
    plain_zh: 'UE 上下文正轉移到另一個節點，這一側釋放自己那份。這是移動性程序的一部分，不是故障。'

  43:
    name: "ue-max-integrity-protected-data-rate-reason"
    plain: 'The UE''s maximum integrity-protected data rate cannot accommodate what was asked for.'
    plain_zh: 'UE 的完整性保護資料速率上限，容納不下所要求的東西。'

  44:
    name: "release-due-to-cn-detected-mobility"
    plain: 'The core network detected the UE has moved and releases this context accordingly. Part of a mobility procedure, not a fault.'
    plain_zh: '核網偵測到 UE 已經移動，據此釋放這個上下文。這是移動性程序的一部分，不是故障。'

  47:
    name: "multiple-location-reporting-reference-ID-instances"
    plain: 'The same location-reporting reference identifier appeared more than once.'
    plain_zh: '同一個位置回報參考識別碼出現了多次。'

  48:
    name: "rsn-not-available-for-the-up"
    plain: 'The redundant sequence number requested for user-plane redundancy is not available.'
    plain_zh: '使用者面冗餘所要求的 RSN 不可用。'

  49:
    name: "npn-access-denied"
    plain: 'Access to this non-public network is denied for this subscriber.'
    plain_zh: '這個用戶被拒絕接取這個非公共網路（NPN）。'
    common_causes:
      - 'The subscriber is not in the NPN''s allowed list'
    common_causes_zh:
      - '用戶不在這個 NPN 的允許清單裡'

  50:
    name: "cag-only-access-denied"
    plain: 'This subscriber may only use CAG cells, and this cell is not one - or the reverse.'
    plain_zh: '這個用戶只能用 CAG cell，而這個 cell 不是 —— 或者情況恰好相反。'

  51:
    name: "insufficient-ue-capabilities"
    plain: 'The UE does not support something this procedure requires.'
    plain_zh: 'UE 缺少這個程序所需的某項能力。'

  52:
    name: "redcap-ue-not-supported"
    plain: 'This cell or network does not support reduced-capability (RedCap) UEs.'
    plain_zh: '這個 cell 或網路不支援精簡能力（RedCap）的 UE。'

  53:
    name: "unknown-MBS-Session-ID"
    plain: 'The multicast/broadcast session identifier is not one the receiver knows.'
    plain_zh: '接收端不認得這個多播／廣播 session 識別碼。'

  54:
    name: "indicated-MBS-session-area-information-not-served-by-the-gNB"
    plain: 'The multicast/broadcast service area indicated is not one this gNB serves.'
    plain_zh: '指定的多播／廣播服務區域不在這個 gNB 的服務範圍內。'

  55:
    name: "inconsistent-slice-info-for-the-session"
    plain: 'The slice information carried for this session contradicts itself or what the network holds.'
    plain_zh: '這個 session 帶的切片資訊自相矛盾，或與網路持有的不一致。'

  56:
    name: "misaligned-association-for-multicast-unicast"
    plain: 'The multicast and unicast legs of this service are not aligned with each other.'
    plain_zh: '這個服務的多播腿與單播腿彼此沒有對齊。'

  57:
    name: "eredcap-ue-not-supported"
    plain: 'This cell or network does not support enhanced reduced-capability (eRedCap) UEs.'
    plain_zh: '這個 cell 或網路不支援增強精簡能力（eRedCap）的 UE。'

  58:
    name: "two-rx-xr-ue-not-supported"
    plain: 'This cell or network does not support two-receiver XR UEs.'
    plain_zh: '這個 cell 或網路不支援雙接收機的 XR UE。'

