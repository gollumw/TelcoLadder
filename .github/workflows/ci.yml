# CI —— 測試矩陣與環境探測
#
# 這份 CI 守得住什麼、守不住什麼，寫在下面。綠勾勾不該製造假安全感。
#
# 守得住：
#   - 三個 Python 版本的相容性。3.13 拿掉了 EntryPoint 的 tuple 介面，
#     而外掛註冊表（見 TODOS 的 E1）正要用 entry point，這個矩陣是它的安全網。
#   - 三個平台的 tshark 定位。telcolens/tshark.py 的後備路徑清單每個平台
#     長得都不一樣（Wireshark.app / Program Files / /usr/bin），
#     `telcolens check` 這一步就是它們各自的真實測試。
#   - **Windows 的輸出編碼。** 這是這份矩陣裡唯一「只有真的在那個 OS 上跑
#     才驗得到」的東西之外的補充：編碼測試本身用 PYTHONIOENCODING 在所有
#     平台重現，但 Program Files 路徑組合與 core.autocrlf 只有 windows job 驗得到。
#   - 邏輯層：cause 查表、Mermaid 渲染、關聯、跳脫。
#
#   - **抽取正確性。** fixture 已自建並進版控，所以 tshark 交叉驗證在 CI 上
#     真的會跑（全部測試無 skip）。這是靠 tests/fixtures/5gc-registration/
#     那份自產擷取檔換來的。
#
# 守不住：
#   - PFCP：adapter 尚未實作，也沒有擷取檔。
#   - SBI 的 5G 語意：現有的 http2 fixture 是通用 HTTP/2 不是 SBI，
#     服務名→網元的對應未經真實流量驗證。
#   - IMS（SIP/Diameter/H.248）：adapter 與 fixture 都還沒有。
#
# 尚未加入：
#   - 外掛相容性測試（裝一個假 plugin，確認被載入且順序正確）。
#     它依賴 entry-point 註冊表，而那個還沒實作。E1 落地後在此加一個 job。

name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支的新 push 取消還在跑的舊 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一個版本失敗不要掐掉其他版本 —— 我們要知道是全滅還是只有某一版。
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # macOS 是主要開發平台，跑一個版本驗證 Homebrew 路徑的 tshark 定位。
          # 注意：這裡驗的是 /opt/homebrew/bin 這條後備路徑，
          # 不是 Wireshark.app 那條（cask 在 runner 上太重）。
          - os: macos-latest
            python: "3.13"
          # Windows 驗兩件開發機上驗不到的事：
          #   ① Program Files 的路徑組合（`Path` 在這裡才是 WindowsPath）
          #   ② core.autocrlf 沒有毀掉 pcap fixture —— 若 .gitattributes 失效，
          #      交叉驗證測試會紅，而且症狀完全看不出是 checkout 的錯。
          - os: windows-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install tshark (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # wireshark-common 的 postinst 會問「要不要讓非 root 使用者抓包」。
          # 預先回答 false —— 我們只讀檔案，不需要抓包權限。
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tshark

      - name: Install tshark (macOS)
        if: runner.os == 'macOS'
        run: brew install wireshark

      - name: Install tshark (Windows)
        if: runner.os == 'Windows'
        # 裝進 C:\Program Files\Wireshark —— 也就是 _fallback_paths() 找的位置。
        # 刻意不設 TELCOLENS_TSHARK：讓自動定位邏輯真的被測到。
        run: choco install wireshark --no-progress -y

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Environment check
        # 這一步本身就是測試：驗證 tshark 定位邏輯在這個作業系統上找得到，
        # 且四個必要 dissector 都在。失敗代表 telcolens/tshark.py 的
        # 後備路徑清單漏了這個平台。
        run: telcolens check

      - name: Run tests
        # fixture 已進版控，所以這裡不該有任何 skip。
        # -ra 保留著：真的出現 skip 時要看得到原因，別讓「全綠」掩蓋覆蓋缺口。
        run: pytest -q -ra
