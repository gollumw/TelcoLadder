# Windows x64 standalone executable — the no-install portable zip.
#
# Built on windows-latest with PyInstaller from the tagged source, smoke-tested
# in the same job against a fixture with a real tshark, and only then attached
# to the GitHub release as TelcoLadder-Windows-x64.zip. `workflow_dispatch`
# builds and keeps the zip as a workflow artifact without touching any release,
# so the recipe can be exercised without cutting a version.
#
# What the zip needs on the target machine: Wireshark 4.0 or newer (tshark.exe).
# It is deliberately not bundled — Wireshark is GPL-2.0 and ships its own
# dissector set — and TelcoLadder locates it in Program Files or through
# TELCOLADDER_TSHARK, exactly as the pip install does.
#
# Why the recipe looks the way it does. Measured 2026-09-11 (PyInstaller 6.22,
# clean non-editable install) by building with each flag dropped in turn and
# running the smoke test plus five fixtures across adapter families:
#   --collect-data telcoladder      load-bearing. The cause tables, decode-as
#                                   list and the browser bundle are package
#                                   data, not code. Drop it and the build
#                                   succeeds, `analyze` still renders a diagram,
#                                   and `summarize` silently stops explaining
#                                   causes — the third smoke command below is
#                                   what turns that into red.
#   --collect-submodules telcoladder insurance, not a requirement today. The
#                                   eleven built-in adapters are static imports
#                                   in adapters/__init__.py (BUILTIN_ADAPTERS),
#                                   so PyInstaller's analysis already bundles
#                                   every one of them; dropping the flag changed
#                                   nothing across five adapter families. It
#                                   starts to matter the day an adapter is
#                                   reached only through an entry point.
#   --copy-metadata telcoladder     insurance, not a requirement today. This
#                                   project declares no telcoladder.adapters
#                                   entry points of its own — pyproject has
#                                   [project.scripts] and nothing else — and a
#                                   frozen bundle cannot have plugins pip
#                                   installed into it, so nothing reads this
#                                   metadata. Dropping it produced no behaviour
#                                   change and no warning. It would matter if
#                                   __version__ ever came from
#                                   importlib.metadata instead of a literal.
# The note that used to stand here said all three were load-bearing and that the
# adapters load through entry points. Both claims were wrong, and the smoke test
# only ever proved the first flag — keep that asymmetry visible rather than
# letting a green run imply more than it checks.

name: Windows portable build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write     # gh release upload, on release events only
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tshark (for the smoke test only)
        # Same location the CI matrix uses; TelcoLadder's fallback paths find it.
        run: choco install wireshark --no-progress -y

      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build the executable
        run: >
          pyinstaller --noconfirm --clean --name telcoladder
          --collect-data telcoladder --collect-submodules telcoladder
          --copy-metadata telcoladder telcoladder/__main__.py

      - name: Assemble the portable folder
        shell: pwsh
        run: |
          $out = "TelcoLadder-Windows-x64"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item -Recurse dist/telcoladder/* $out/
          Copy-Item LICENSE, NOTICE, README.md $out/
          Copy-Item packaging/check-environment.cmd $out/
          Copy-Item packaging/PORTABLE-README.txt $out/README-PORTABLE.txt

      - name: Smoke test the bundle
        # Three commands, three things proven: tshark is found and the dissectors
        # are present; a fixture renders (the built-in adapters reached the
        # bundle); a known cause is explained (the YAML tables travelled with
        # the exe — the one thing that goes red if --collect-data is dropped).
        shell: pwsh
        run: |
          $exe = "TelcoLadder-Windows-x64/telcoladder.exe"
          & $exe check
          if ($LASTEXITCODE -ne 0) { throw "telcoladder check failed inside the bundle" }
          $diagram = & $exe analyze tests/fixtures/5gc-registration/capture.pcap
          if ($LASTEXITCODE -ne 0 -or -not ($diagram -match "sequenceDiagram")) { throw "analyze produced no diagram" }
          $summary = & $exe summarize tests/fixtures/ki-mismatch/capture.pcap
          if ($LASTEXITCODE -ne 0 -or -not ($summary -match "Synch failure")) { throw "cause tables not bundled" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path TelcoLadder-Windows-x64 -DestinationPath TelcoLadder-Windows-x64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: TelcoLadder-Windows-x64
          path: TelcoLadder-Windows-x64.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" TelcoLadder-Windows-x64.zip --clobber
