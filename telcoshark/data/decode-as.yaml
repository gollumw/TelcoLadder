# 隨程式出貨的已知解碼規則 —— 實地驗證過的經驗。
#
# ## 這份檔跟 `~/.config/telcoshark/decode-as.json` 的差別
#
# 那份是**這台機器上這個人**的設定，不會跟著程式走。這份在版控裡、隨套件
# 出貨，所以拿到這個程式的人**一開始就有你驗證過的經驗**，不必自己再撞
# 一次同樣的牆。
#
# ## 為什麼是「候選」而不是無條件套用
#
# 這些埠在某些網路裡跑 SBI，在別人的網路裡可能跑的是別的東西 —— port 80
# 尤其明顯，它平常就是一般 HTTP。無條件把它解成 HTTP/2，別人的擷取檔裡
# 真正的網頁流量會從 HTTP 變成解不出內容的 HTTP2，而且不報錯。
#
# 所以這裡的每一條都走 `pipeline` 既有的那道閘：**用它重跑一次，只有在
# 訊息數真的增加時才採用**。不適用的檔案上它會自己退場，什麼都不影響。
#
# ## 加一條之前
#
# `note` 要寫**在哪份擷取檔上驗證過**。少了它，三個月後沒有人知道這條
# 規則是根據什麼加的，也就沒有人敢刪。
rules:
  - rule: tcp.port==7070,http2
    note: 電信商 AMF 的 per-IMSI trace（2026-08）—— SMF 的 SBI 走 7070
  - rule: tcp.port==8080,http2
    note: 同上擷取檔 —— AMF 的 namf-comm 走 8080
  - rule: tcp.port==80,http2
    note: 同上擷取檔 —— NRF 探索走 80。**這個埠平常是一般 HTTP**，所以只能是候選
  - rule: tcp.port==81,http2
    note: 同上擷取檔 —— UDM 的 nudm-sdm 走 81
