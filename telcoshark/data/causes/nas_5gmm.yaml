# 5GMM cause values —— TS 24.501 §9.11.3.2（說明見同規範 Annex A）。
#
# 這份表是人工核對的規範資產，**不是模型生成的**。AI 層永遠不得產出 `spec`
# 或 `clause` 欄位 —— 一個幻覺出來的條號會讓電信工程師直接關掉這個工具。
# 查無此號時輸出「未收錄」，不猜。
#
# 欄位：
#   name          規範裡的正式名稱，逐字照抄
#   spec/clause   出處
#   plain         給人看的白話，講「實際上發生了什麼」
#   common_causes 現場最常見的根因，由實務經驗整理，不是規範內容
#
# plain 與 common_causes 一律寫**純文字**：它們會被原樣畫進 Mermaid 標籤、
# SVG `<text>` 與 HTML 報告，三個地方都不解析 markdown，寫 `**粗體**`
# 只會讓星號直接出現在圖上。

table: nas_5gmm
spec: "3GPP TS 24.501"
clause: "§9.11.3.2"

causes:
  3:
    name: "Illegal UE"
    plain: "網路認為這個用戶身分不合法，鑑權沒過或該 SUPI 根本不被承認。"
    common_causes:
      - "UDM/UDR 裡沒有這個 SUPI（沒開通、或測試 SIM 沒寫進資料庫）"
      - "鑑權向量算出來對不上，K/OPc 設定錯誤"
      - "SUCI 解密失敗，歸戶到不存在的用戶"

  5:
    name: "PEI not accepted"
    plain: "網路不接受這台設備的識別碼（IMEI）。"
    common_causes:
      - "IMEI 落在黑名單"
      - "EIR 檢查未通過"

  6:
    name: "Illegal ME"
    plain: "設備本身被網路擋下，通常是 IMEI 進了黑名單。"
    common_causes:
      - "設備遭掛失／盜報"
      - "EIR 黑名單設定錯誤"

  7:
    name: "5GS services not allowed"
    plain: "這個用戶沒有訂閱 5GS 服務。"
    common_causes:
      - "該 SUPI 根本不在 UDM/UDR 裡 —— SIM 從未開通。實務上最常見的一種，
         核網日誌會寫 `Cannot find SUPI [404]`
         （tests/fixtures/supi-not-provisioned 實測）"
      - "簽約資料裡沒開 5G 存取"
      - "UDM 的 access restriction 擋掉 3GPP 存取"

  9:
    name: "UE identity cannot be derived by the network"
    plain: "網路認不出這個 UE 是誰，通常是它用了網路端已經失效的暫時識別碼。"
    common_causes:
      - "AMF 重啟後遺失 UE context，而 UE 仍拿舊的 5G-GUTI 來註冊"
      - "AMF 之間 context 轉移失敗"

  10:
    name: "Implicitly de-registered"
    plain: "網路早已把這個 UE 隱含地登出，UE 卻還以為自己在線上。"
    common_causes:
      - "UE 長時間沒有週期性註冊更新，網路端計時器到期"

  11:
    name: "PLMN not allowed"
    plain: "這張 SIM 不准用這個網路。"
    common_causes:
      - "漫遊協議未涵蓋此 PLMN"
      - "測試環境的 MCC/MNC 與 SIM 寫的不一致"

  12:
    name: "Tracking area not allowed"
    plain: "這個追蹤區不開放給該用戶。"
    common_causes:
      - "簽約資料的區域限制"

  13:
    name: "Roaming not allowed in this tracking area"
    plain: "該用戶在這個追蹤區不得漫遊。"
    common_causes:
      - "漫遊限制設定"

  15:
    name: "No suitable cells in tracking area"
    plain: "此追蹤區內沒有這個 UE 可以用的細胞。"
    common_causes:
      - "細胞禁止存取（cell barred）"
      - "存取類別限制"

  20:
    name: "MAC failure"
    plain: "UE 驗不過網路送來的鑑權訊息完整性 —— UE 認為對方不是它的家網。"
    common_causes:
      - "SIM 的 K 與 HSS/UDM 裡的不一致（測試環境最常見）"
      - "OPc 與 OP 搞混，或 OPc 算錯"

  21:
    name: "Synch failure"
    plain: "SQN 序號不同步，UE 要求網路重新同步。"
    common_causes:
      - "同一張 SIM 同時在兩套核網上使用"
      - "UDM 資料庫回滾導致 SQN 倒退"

  22:
    name: "Congestion"
    plain: "網路過載，暫時擋下這次請求。通常會附帶 back-off 計時器。"
    common_causes:
      - "AMF/SMF 過載保護啟動"
      - "大量 UE 同時重新註冊（例如網路故障恢復後的雪崩）"

  23:
    name: "UE security capabilities mismatch"
    plain: "UE 回報的安全能力，與網路先前收到的對不上。"
    common_causes:
      - "中間人竄改，或轉送路徑上有設備改寫了 NAS 訊息"

  24:
    name: "Security mode rejected, unspecified"
    plain: "安全模式程序被拒，沒有進一步原因。"
    common_causes:
      - "UE 與網路支援的演算法沒有交集"

  27:
    name: "N1 mode not allowed"
    plain: "不允許這個用戶使用 N1 模式（也就是 5G SA）。"
    common_causes:
      - "簽約限制只准 EPS"
      - "網路政策把該用戶導回 4G"

  28:
    name: "Restricted service area"
    plain: "UE 位於受限服務區，只能做部分程序。"
    common_causes:
      - "簽約的服務區域限制"

  31:
    name: "Redirection to EPC required"
    plain: "網路要求 UE 改走 EPC（4G）。"
    common_causes:
      - "該用戶或該區域的政策是 5G 導回 4G"

  43:
    name: "LADN not available"
    plain: "本地資料網路（LADN）目前不可用。"
    common_causes:
      - "UE 不在該 LADN 的服務區內"

  65:
    name: "Maximum number of PDU sessions reached"
    plain: "這個 UE 的 PDU session 數量已達上限。"
    common_causes:
      - "舊 session 沒有正常釋放而累積"

  72:
    name: "Non-3GPP access to 5GCN not allowed"
    plain: "不允許經由非 3GPP 存取（例如 Wi-Fi）接入 5G 核網。"
    common_causes:
      - "簽約未開通非 3GPP 存取 —— VoWiFi 相關問題常見於此"

  73:
    name: "Serving network not authorized"
    plain: "服務網路未獲授權。"
    common_causes:
      - "SNPN 或漫遊夥伴關係設定錯誤"

  90:
    name: "Payload was not forwarded"
    plain: "NAS 傳輸訊息裡的內容沒有被轉送出去。"
    common_causes:
      - "目標 NF 不可達或拒收"

  91:
    name: "DNN not supported or not subscribed in the slice"
    plain: "這個切片不支援該 DNN，或用戶沒訂閱。"
    common_causes:
      - "DNN 拼寫錯誤"
      - "簽約資料裡的 S-NSSAI 與 DNN 組合不存在"

  95:
    name: "Semantically incorrect message"
    plain: "訊息語意不正確。"
    common_causes:
      - "實作不相容，或訊息被中途竄改"

  96:
    name: "Invalid mandatory information"
    plain: "必要資訊元素的內容無效。"
    common_causes:
      - "編碼錯誤"
      - "版本差異導致必要 IE 格式不同"

  97:
    name: "Message type non-existent or not implemented"
    plain: "收到的訊息型別不存在，或對方沒實作。"
    common_causes:
      - "UE 與網路的 3GPP release 版本落差"

  98:
    name: "Message type not compatible with the protocol state"
    plain: "訊息型別與當下的協定狀態不相容。"
    common_causes:
      - "狀態機不同步，常見於前一則訊息遺失或重傳"

  99:
    name: "Information element non-existent or not implemented"
    plain: "某個資訊元素不存在或未實作。"
    common_causes:
      - "版本落差"

  100:
    name: "Conditional IE error"
    plain: "條件式資訊元素有誤 —— 該帶的沒帶，或不該帶的帶了。"
    common_causes:
      - "實作對條件判斷的解讀不一致"

  101:
    name: "Message not compatible with the protocol state"
    plain: "訊息與當下協定狀態不相容。"
    common_causes:
      - "狀態機不同步"

  111:
    name: "Protocol error, unspecified"
    plain: >-
      協定錯誤，規範未指明細節。這是最沒有資訊量的 cause —— 它的意思接近
      「對方看不懂這則訊息，但說不出哪裡不對」。
    common_causes:
      - "鑑權金鑰不符：Ki 或 OPc 兩邊不一致時，UE 會先回 Synch failure(#21)，
         而它算出的 AUTS 網路無法用來重同步，最後就以本 cause 拒絕。
         看到 #21 緊接 #111 幾乎必然是金鑰問題
         （tests/fixtures/ki-mismatch 實測）"
      - "編碼／解碼不相容，常見於不同廠商設備互連"
      - "必要 IE 缺漏或長度欄位算錯"
      - "3GPP release 版本落差導致新 IE 被舊端拒收"
