<!-- GitHub's social preview card (Settings -> General -> Social preview).
     GitHub exposes no API for it, so the upload is manual; this file exists so the
     image is regenerable rather than a one-off nobody can reproduce:

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
         --screenshot=docs/social-preview.png --window-size=1280,640 \
         --force-device-scale-factor=2 --hide-scrollbars docs/social-preview.html

     Renders 2560x1280 (2x GitHub's recommended 1280x640), well under its 1 MB cap.
     Colours are the interface's calibrated semantic palette (OKLCH L≈0.72 across all four hues).
     The cause count here is a claim about the program - tests/test_causes.py pins it. -->
<!doctype html><meta charset="utf-8">
<style>
  /* palette: the interface's semantic colours — L≈0.720 across all four hues */
  :root{ --canvas:#090d16; --ink:#e8edf5; --muted:#8b98ab; --line:#1e2836;
         --fail:#f67a73; --ok:#3ac178; --accent:#39b6d0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px}
  body{background:var(--canvas);
       font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;
       color:var(--ink);overflow:hidden;position:relative}
  .glow{position:absolute;width:980px;height:980px;right:-300px;top:-360px;border-radius:50%;
        background:radial-gradient(circle,rgba(57,182,208,.14) 0%,transparent 62%)}
  .wrap{position:relative;height:100%;padding:66px 72px 60px;display:flex;flex-direction:column}
  h1{font-size:78px;font-weight:700;letter-spacing:-2.6px;line-height:1}
  h1 .b{color:var(--accent)}
  .lede{font-size:35px;font-weight:600;margin-top:26px;line-height:1.28;max-width:600px;letter-spacing:-.5px}
  .lede em{font-style:normal;color:var(--accent)}
  .sub{font-size:23px;color:var(--muted);margin-top:22px;line-height:1.45;max-width:590px}
  .ladder{position:absolute;right:66px;top:100px;width:512px}
  .cmd{margin-top:40px;font-family:"SF Mono",Menlo,monospace;font-size:25px;color:#c4cede;
       background:rgba(255,255,255,.032);border:1px solid var(--line);border-radius:11px;
       padding:17px 24px;display:inline-block;align-self:flex-start;letter-spacing:-.2px}
  .cmd .d{color:#5d6b7f}  .cmd .a{color:var(--accent)}
  .pills{margin-top:auto;display:flex;align-items:center;gap:13px}
  .p{font-size:21px;padding:9px 20px;border-radius:999px;border:1px solid var(--line);
     color:var(--muted);background:rgba(255,255,255,.022);white-space:nowrap}
  .p.hi{border-color:rgba(57,182,208,.45);color:var(--accent)}
  text{font-family:"SF Mono",Menlo,monospace}
</style>
<div class="glow"></div>
<div class="wrap">
  <h1>Telco<span class="b">Ladder</span></h1>
  <div class="lede">A capture goes in.<br>Every failure comes out <em>explained</em>.</div>
  <div class="sub">One subscriber correlated across 5G core, 4G&#8239;/&#8239;EPC and IMS
    &mdash; on a single timeline, with the specification cited.</div>

  <!-- the NAS view (`telcoladder analyze --flow`): NAS is a UE<->AMF protocol that
       the gNB only relays, so the semantic peers are UE and AMF. Message text is
       centred over its own arrow - left-aligning every label makes all four look
       as though they start at the same lane. -->
  <svg class="ladder" viewBox="0 0 512 346" fill="none">
    <text x="36"  y="15" fill="#8b98ab" font-size="16" text-anchor="middle">UE</text>
    <text x="356" y="15" fill="#8b98ab" font-size="16" text-anchor="middle">AMF</text>
    <line x1="36"  y1="28" x2="36"  y2="340" stroke="#1e2836" stroke-width="2"/>
    <line x1="356" y1="28" x2="356" y2="340" stroke="#1e2836" stroke-width="2"/>

    <text x="196" y="52" fill="#c4cede" font-size="15.5" text-anchor="middle">Registration request</text>
    <line x1="36" y1="62" x2="347" y2="62" stroke="#3ac178" stroke-width="2"/>
    <path d="M356 62 l-12 -5.5 v11 z" fill="#3ac178"/>

    <text x="196" y="102" fill="#c4cede" font-size="15.5" text-anchor="middle">Authentication request</text>
    <line x1="356" y1="112" x2="45" y2="112" stroke="#3ac178" stroke-width="2"/>
    <path d="M36 112 l12 -5.5 v11 z" fill="#3ac178"/>

    <rect x="8" y="146" width="496" height="70" rx="10"
          fill="rgba(246,122,115,.10)" stroke="rgba(246,122,115,.34)"/>
    <text x="196" y="164" fill="#f4dcda" font-size="15.5" text-anchor="middle">Authentication failure</text>
    <line x1="36" y1="174" x2="347" y2="174" stroke="#f67a73" stroke-width="2"/>
    <path d="M356 174 l-12 -5.5 v11 z" fill="#f67a73"/>
    <text x="256" y="202" fill="#f67a73" font-size="14.5" text-anchor="middle">Synch failure (#21) — TS 24.501 §9.11.3.2</text>

    <rect x="8" y="240" width="496" height="70" rx="10"
          fill="rgba(246,122,115,.10)" stroke="rgba(246,122,115,.34)"/>
    <text x="196" y="258" fill="#f4dcda" font-size="15.5" text-anchor="middle">Registration reject</text>
    <line x1="356" y1="268" x2="45" y2="268" stroke="#f67a73" stroke-width="2"/>
    <path d="M36 268 l12 -5.5 v11 z" fill="#f67a73"/>
    <text x="256" y="296" fill="#f67a73" font-size="14.5" text-anchor="middle">Protocol error (#111) — TS 24.501 §9.11.3.2</text>
  </svg>

  <div class="cmd"><span class="d">$</span> telcoladder analyze <span class="a">capture.pcapng</span></div>

  <div class="pills">
    <span class="p hi">775 spec-cited cause explanations</span>
    <span class="p">Mermaid &middot; browser &middot; MCP server</span>
    <span class="p">Apache-2.0</span>
  </div>
</div>
