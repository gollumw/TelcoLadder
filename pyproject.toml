[project]
name = "telcolens"
version = "0.1.0"
description = "Turn telecom signalling captures into Mermaid sequence diagrams — 5G core today, IMS/VoLTE next."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "gollumw" }]
keywords = ["5g", "ngap", "nas", "pcap", "wireshark", "mermaid", "sequence-diagram", "ims", "volte", "diameter"]

# 相依刻意保持極少。tshark 是外部執行檔，不是 Python 套件。
# 不用 pyshark：它只是 tshark 的慢包裝，多一層依賴無收益。
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
telcolens = "telcolens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["telcolens*"]

[tool.setuptools.package-data]
telcolens = ["data/causes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 背景執行緒裡的例外預設只是警告 —— 測試照樣全綠，沒人會看到。
# 而它代表的東西很實在：使用者會在終端機看到一段像當機的 traceback。
# 這條把它變成失敗。（Windows 的 communicate() 是靠讀取執行緒實作的，
# 這個坑只在那裡出現，見 extract.py 的 _shutdown。）
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
